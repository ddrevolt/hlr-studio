# HLR paid slot map (role slotmap_paid). PLANNED, NOT BUILT: lane D, Pack v0 structure side, 2026-10-18.
# Status: held for Review 2 (Gate 2 call 1 b, Eddie, 2026-10-18). The paid taxonomy and these masters
# are ratified at Review 2 with the first masters. Until then the File map leaves slotmap_paid null
# and paid briefs run on the engine's bundled ad types; this file is the Step 4 build plan. Type ids
# in use_when name the held paid roster (type-registry-core.json held_for_review_2.paid). Every
# module and slot is "proposed, unbuilt".
# Budgets: every max_chars is null until Step 4 builds and measures the masters (slot contract,
# fixed canvases). No budget is invented. paid_lint.js reads a null ceiling as no ceiling; the
# copy lints say a slot carries no measured budget.
# Sources: outputs/step-1-review/pattern-review.md (2.3, 3, 4.3, 4.4), patterns/patterns-paid.md,
# DECISIONS 2026-10-17 (Q11: Meta 1:1, 4:5, 9:16; Google 1.91:1 and 1200x1200; IAB display).
# Node ids are the reference file LYyYXPDUHVoAABh865EvMI (read-only); library node ids arrive at Step 4.
# Ids: P## per Gate 3 call 10; slots P##.<role> or P##.<group><n>.<role>. One line per slot: the
# engine's paid_lint.js and fit_check.js read slot lines with a line parser.
# case, house style (Gate 2 call 2 a, Eddie, 2026-10-18): headlines and lines in sentence case
# [documented p17]; eyebrows in tracked caps [documented p17]; callouts, labels, sublines and terms
# in caps [observed]; names, quotes, scripts and cues as written (as-is).
# Role hook (title on P03) marks each module's primary on-image line: paid_lint.js maps a copy
# execution's on_image to it. Other slots take explicit in_frame ids. P02's name and P08's tiles are
# data from the product database, never written.
# Wordmark, star and handle are elements (E##), never slots. No CTA is drawn in Meta art: the
# platform adds it [observed].

meta:
  namespace: hlr
  key: slot
  file_key: Gq3yUbLs6MCRM0nOhjvnIW
  page: "02 Modules"
  modules: 11
  status: "proposed, unbuilt"
  built: null
  measured_at: null
  safe_zones:
    status: "ruled (Gate 2 call 3 b, Eddie, 2026-10-18)"
    authority: "Platform numbers live in the engine, never here: skills/paid-ad-copy/references/placement-specs.json (ratios, keep_clear_px; verified 2026-07-27). Meta's Ads Guide refuses automated reads, so confirm the 9x16 zone in Ads Manager's placement preview before the first paid build (LEARNINGS 2026-10-17; owner Eddie)."
    nine_by_sixteen: "Every paid 9x16 master keeps text, marks, callouts and the product's key detail inside the engine's ads 9x16 keep-clear, the unified Stories and Reels zone. Organic stories (S04) keep the organic story band instead (slotmap-social.yaml meta.safe_zones); a story runs as an ad only after a re-layout onto a P## master."
    sign_off: "The wordmark sits above the bottom keep-clear in 9x16. [observed] it sits 120 px from the foot in 27 board frames, and the lowest text sits 30 to 185 px from the foot in 14 of 16 checked frames: inside the band."
    feed: "1x1 and 4x5 follow the engine's keep_clear_px as comfort padding (no platform UI overlay); HLR's margins are layout tokens (lane B)."
    google_and_display: "No platform UI overlay. Google art carries no overlaid copy and no drawn CTA (Gate 2 call 1, Google a), so P10 stamps no text. Display keeps HLR's margins (lane B)."
  display_floors:
    status: "ruled (Gate 2 call 5 a, Eddie, 2026-10-18)"
    unit: "CSS px at 1x; masters built at the IAB size and exported at 1x and 2x [derived]"
    body: 14
    small: 12
    applies_to: "P11 at 728x90, 300x250 and 160x600, and the web type ramp: lane B's web label step moves from 11 to 12 (tokens.json font.size.web-label)"
    provenance: "[derived, ruled] the rendered floors of the pattern review's addendum 5: no text under 12 px rendered, body at 14 px. Replaced small 11 (the review's section 3 table and lane B's first web ramp)."
    observed: "[observed] live banners set text at 3.5 to 9 px; leaderboard quote about 13 px, medium rectangle 16, wide skyscraper 14, 180x150 quote about 8 px and tagline about 3 px; banners named for IAB sizes are built at 500x300 and 600x160 (patterns-paid.md)."
    sizes_source: "IAB sizes as Google lists them for display (support.google.com/authorizedbuyers/answer/3011898, read 2026-10-18): 300x250, 728x90 and 160x600 are among its top performers; 180x150 (small rectangle) and 320x50 (mobile leaderboard) are supported. 180x150 is not planned (its text rendered at 3 to 8 px); 320x50 is not observed."

