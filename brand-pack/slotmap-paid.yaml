    status: "proposed, unbuilt"
    property: { Ratio: ["1x1", "4x5", "9x16"], Style: ["Line", "Masthead"] }
    variants:
      - { name: "Ratio=1x1", size: "1080x1080" }
      - { name: "Ratio=4x5", size: "1080x1350" }
      - { name: "Ratio=9x16", size: "1080x1920" }
    slots:
      - { id: P01.headline, role: hook, max_chars: null, case: sentence, status: "proposed, unbuilt" }
      - { id: P01.body, role: body, max_chars: null, case: sentence, status: "proposed, unbuilt" }
  P02:
