# HLR email slot map (role slotmap): the email masters and the elements they compose, as built.
# Chat 6, 2026-10-23, overnight (Claude under Eddie's delegation; DECISIONS 2026-10-23). Library HLR Library
# Gq3yUbLs6MCRM0nOhjvnIW: modules on 02 Modules (7:3), elements on 01 Elements (7:2), templates on 03 Templates (7:4).
# 27 modules (M01 to M27) and 15 elements (E01 to E15). M11 to M21, E07 and E08 came from the comprehensiveness
# pass over HLR's live sends (Design Pull 2:4458, 2:4432, 2:7443, 2:190749 and the pattern review), 2026-10-23;
# M22 to M27, E09 to E15, E01 Style=Filled and the options on M02, M04, M09, M17, M18 and M19 (M11 and M12 after the review) came after Eddie's
# decision sheet the same day (the filled CTA, the roster, product images by category, the rest of the templates).
# Canvas: email. Masters are 1200 wide, sent as image slices (Gate 1 C8); every master sets the email mode on its
# root (every variant of a set), and elements stay on Auto.
# Budgets: an email module hugs its height, so its copy never clips. typical_chars is the drawn copy, flex_verified
# the multiple the flex probe proved at 1200 (2x, 3x, 4x; each slot alone and all slots together; no text clipped,
# none colliding with a painted neighbour, none overflowing a fixed box; the tightest variant; re-probed on the real
# faces), and max_chars = typical_chars x flex_verified, the proven length that build_seam_map.py and
# copy_lint.js read. It is not a design ceiling (slot contract: no ceilings); the gap between the two contracts is
# logged for lane H (engine gap G3).
# Optional slots (option: ...) are hidden by default and were measured on an instance with the option switched on.
# Measured on the real faces (Saol Display, Saol Standard, Trade Gothic LT Std, Homemade Apple), 2026-10-23, after
# Eddie loaded them to the team Figma; the stand-in measure (Instrument Serif, Inter) differed in one slot only
# (M06 E02.label, 3x then, 4x now). The license flag stays raised until HLR confirms the licenses.
# case, house style (Gate 2 call 2 a, Eddie, 2026-10-18): headlines and lines in sentence case; eyebrows and CTA
# labels in caps; names, scripts, nav labels, labels, numbered headlines, reviews and the disclaimer as written
# (as-is). E02.label and E07.name are as-is because their styles set the caps.
# Chat 6b, 2026-10-23: 01 Elements and 02 Modules are grouped into titled registry sections (names and ids kept); E06 and M06 became
# sets (Align=Left, the original, and Align=Center), E06 gained Show label, Show description and Show link, M06 sets each row's links
# in a row of their own, M02 gained Tall, M12 gained Size=Tall and E05 Crop=Tall, all to rebuild HLR's 2026 sends (Eddie, 2026-10-23).
# Composed elements are stamped once on the element (E##.role) and declared on the host module (composed). A composed
# slot carries the tightest budget among the element and its hosts (budget_from names the host that sets it); a host
# whose column cannot take the element budget stamps its own slot (M11.cta, M12.cta: the E01 label at 2x there).
# The footer disclaimer is legal-ledger.json HLR-REQ-01, carried verbatim (verbatim: true). Reviews (M18) are a
# sourced export, verbatim: no review slot is ever filled without a source.
# 2026-10-23, Review 1 (Eddie, live): email type moved to HLR's 2026 sends: body leading 1.40, headline leading 1.0, the eyebrow Bold at 30 tracked 0.25em, the arrow link in Saol Display. The eyebrow and link-label slots were re-probed alone at their proven lengths in every variant on the real faces (32 placements: E02.label in E02, E06, E07, M03, M06, M15 and M18; the eyebrows of M02, M03, M04, M11, M17, M19 and M22): none clipped, collided with a painted neighbour or overflowed a fixed box, so their budgets stand. Body and headline slots only got shorter. M23 carries Marks/Lockup and opens 9 of the 17 staged sends; M01 the other 8.
# 2026-10-23, Review 1 (Eddie, live), later: the email scale moved to the sends designed at 1200 (body 34, label 26, title 35, link 46; Review 1 email scale) and M04 gained Style=Statement (the quote style, Saol Display Regular 64 at 1.2 in email; Review 1 statement). Re-probed at proven lengths on the real faces, optional layers on: 67 label, CTA, link, fine and eyebrow placements alone, then M03, M04 Statement, M07 and M18 alone and all together (18 and 18): none clipped, collided or overflowed a fixed box, once M27's date was made to wrap (its 68-character budget ran past the masthead at 1200, before and after the change). Body, title and headline slots only got shorter.

