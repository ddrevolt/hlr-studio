# HLR email slot map (role slotmap): the email masters and the elements they compose, as built.
# Chat 6, 2026-10-23, overnight (Claude under Eddie's delegation; DECISIONS 2026-10-23). Library HLR Library
# Gq3yUbLs6MCRM0nOhjvnIW: modules on 02 Modules (7:3), elements on 01 Elements (7:2), templates on 03 Templates (7:4).
# 21 modules (M01 to M21) and 8 elements (E01 to E08). M11 to M21, E07 and E08 came from the comprehensiveness
# pass over HLR's live sends (Design Pull 2:4458, 2:4432, 2:7443, 2:190749 and the pattern review), 2026-10-23.
# Canvas: email. Masters are 1200 wide, sent as image slices (Gate 1 C8); every master sets the email mode on its
# root (every variant of a set), and elements stay on Auto.
# Budgets: an email module hugs its height, so its copy never clips. typical_chars is the drawn copy, flex_verified
# the multiple the flex probe proved at 1200 (2x, 3x, 4x; each slot alone and all slots together; no text clipped,
# none colliding with a painted neighbour, none overflowing a fixed box; the tightest variant; re-probed after review
# round 2), and max_chars = typical_chars x flex_verified, the proven length that build_seam_map.py and
# copy_lint.js read. It is not a design ceiling (slot contract: no ceilings); the gap between the two contracts is
# logged for lane H (engine gap G3).
# Optional slots (option: ...) are hidden by default and were measured on an instance with the option switched on.
# Measured on the build stand-ins (Instrument Serif for Saol, Inter for Trade Gothic; license flag raised): every
# budget is provisional until re-measured on the real faces in the desktop app.
# case, house style (Gate 2 call 2 a, Eddie, 2026-10-18): headlines and lines in sentence case; eyebrows and CTA
# labels in caps; names, scripts, nav labels, labels, numbered headlines, reviews and the disclaimer as written
# (as-is). E02.label and E07.name are as-is because their styles set the caps.
# Composed elements are stamped once on the element (E##.role) and declared on the host module (composed). A composed
# slot carries the tightest budget among the element and its hosts (budget_from names the host that sets it); a host
# whose column cannot take the element budget stamps its own slot (M11.cta, M12.cta: the E01 label at 2x there).
# The footer disclaimer is legal-ledger.json HLR-REQ-01, carried verbatim (verbatim: true). Reviews (M18) are a
# sourced export, verbatim: no review slot is ever filled without a source.

