  page: "02 Modules"
  modules: 3
  status: "proposed, unbuilt"
  built: null
  measured_at: null
  safe_zones:
    status: "ruled (Gate 2 call 3 b, Eddie, 2026-10-18)"
    authority: "Platform numbers live in the engine, never here: social-copy/references/organic-specs.json (grid crop, story band) and paid-ad-copy/references/placement-specs.json (the ads 9x16 zone)."
    story: "S04 keeps text, marks and the product's key detail inside the organic story band (organic-specs.json story: top and bottom 250 px, confidence contested), not the ads zone. This departs from the engine's default for story sets (the ads 9x16 keep-clear). A story runs as an ad only after a re-layout onto a P## master (slotmap-paid.yaml). The organic band rests on one 2026 guide: confirm it on a live story before the first S04 build (owner Eddie)."
    sign_off: "The handle sits above the bottom band. [observed] story handles sit at y 1607 of 1920 with 289 px clear below, outside the organic band, so the live placement holds."
    stickers: "Link, poll and question stickers are added in the app [observed]. Each S04 structure leaves a clear band for them; its position is set at Step 4, not here."
    feed: "S01 and S03 keep text and the focal point inside the profile grid's 3:4 crop (organic-specs.json grid) plus HLR's side margin, a layout token (lane B)."

