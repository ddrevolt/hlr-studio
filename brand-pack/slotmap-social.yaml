# HLR organic social slot map (role slotmap_social). PLANNED, NOT BUILT: lane D, Pack v0 structure side, 2026-10-18.
# Status: the organic social taxonomy is ratified (Gate 2 call 1 b, Eddie, 2026-10-18), so the File map
# wires this map now. The masters are planned and unbuilt: every slot is "proposed, unbuilt" until
# Step 4 measures it.
# Budgets: every max_chars is null with a status until Step 4 builds the masters and measures each
# slot on its tightest variant with the flex probe (slot contract, fixed canvases). No budget is
# invented; social_lint.js asks for a sign-off on copy written into a null slot.
# Masters follow the engine's portable recipes (asset-production references/asset-types.md):
# S01 feed post set, S03 carousel set, S04 story set. S02 is not planned: HLR's reel covers are
# photo-only 4:5, which S01's photo structure covers. Gate 1 (b) ruled S03 and S04 for HLR.
# Sources: outputs/step-1-review/pattern-review.md (2.2, 3, 4.3, 4.4), patterns/patterns-social.md,
# DECISIONS 2026-10-17. Node ids are the reference file LYyYXPDUHVoAABh865EvMI (read-only).
# case, house style (Gate 2 call 2 a, Eddie, 2026-10-18): headlines and lines in sentence case
# [documented p17]; eyebrows in tracked caps [documented p17]; callouts, labels, sublines and terms
# in caps [observed]; names, quotes, scripts and cues as written (as-is). The live grid's serif caps
# headlines retire with Instrument Serif (C5). Caption layers are not set on the art and take their
# case as written.
# Handle, star and wordmark are elements (E##), never slots. No CTA box on social: cues are plain
# text [observed: 0 of 52 renders carry a button].
# Captions: S01.caption and S03.caption are caption layers beside the set, never exported. The
# Gate 1 (b) reason reads "captions live in layers"; where captions live stays HLR's (Review 1).

