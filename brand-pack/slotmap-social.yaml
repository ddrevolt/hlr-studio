    use_when: "A single 4:5 post: photo only, headline on photo, text tile on a flat ground, or offer tile (social types photo, mantra, quote, offer, product_spotlight). Patterns S-PHOTO, S-PHOTOTEXT, S-TEXT, S-OFFER; nodes 2:181774, 2:181982, 2:181328, 2:181188. 1x1 and 9x16 siblings are the engine recipe's; HLR's live feed is 4:5 only and its older 1:1 posts retire."
    status: "proposed, unbuilt"
    property: { Ratio: ["4x5"], Structure: ["Photo", "Headline on photo", "Text tile", "Offer tile"] }
    variants:
      - { name: "Ratio=4x5", size: "1080x1350" }
    slots:
      - { id: S01.eyebrow, role: eyebrow, max_chars: null, case: upper, status: "proposed, unbuilt" }
      - { id: S01.headline, role: headline, max_chars: null, case: sentence, status: "proposed, unbuilt" }
      - { id: S01.body, role: body, max_chars: null, case: sentence, status: "proposed, unbuilt" }
      - { id: S01.script, role: script, max_chars: null, case: as-is, status: "proposed, unbuilt" }
      - { id: S01.cue, role: cue, max_chars: null, case: as-is, status: "proposed, unbuilt" }
      - { id: S01.image, role: image, status: "proposed, unbuilt" }
      - { id: S01.caption, role: caption, max_chars: null, case: as-is, status: "proposed, unbuilt" }
  S03:
    name: "Carousel Set"
    family: social
    use_when: "The default post: a cover, one or more inner panels and an end panel, separate 4:5 frames in gutter mode (social types education, annotated_product, mantra; series words_for_your_journey, energy_medicine, field_notes, season_crystals, proof_of_magic). Patterns S-WFYJ, S-ENERGY, S-ANNOT, S-SEASON, S-LONG, S-PROOF; nodes 2:181816, 2:181792, 2:180130, 2:181620, 2:180943, 2:181769. Inner items carry callouts and stone labels; their words are sourced facts from products.json."
    status: "proposed, unbuilt"
    parts: [cover, inner, end]
    build_modes: [gutter]
    property: { Panel: ["Cover", "Inner", "End"] }
    variants:
