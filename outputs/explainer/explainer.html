l an open gap (token-model K2)."},"readers":[{"id":"team","label":"I’m on HLR’s team","hint":"Plain language. Start with the journey, then the rulebook.","mode":"plain","start":"journey"},{"id":"operator","label":"I run the forge","hint":"Adds file paths, ids, scripts and the record.","mode":"technical","start":"rulebook"},{"id":"overview","label":"Just the overview","hint":"The three parts, the journey and the comparison.","mode":"plain","start":"system"}],"nav":[{"id":"system","label":"The system"},{"id":"journey","label":"The journey"},{"id":"rulebook","label":"The rulebook"},{"id":"changes","label":"When things change"},{"id":"compare","label":"Forge or Claude Design"},{"id":"check","label":"Check yourself"}],"system":{"headline":["One system, three ","parts"],"intro":"Everything the forge knows about HLR lives in one place, and everything it does is one of a small set of skills. The people around it make the calls a machine shouldn’t.","parts":[{"id":"pack","name":"The pack","what":"HLR’s rules and facts, kept in files: products, claims, voice, email types, design tokens and measured slot lengths.","detail":"Read fresh on every run. A fact the pack doesn’t carry doesn’t exist for the forge.","stat":"{roles_total} roles; {roles_null} still empty, each with an owner","technical":"brand-pack/ · the File map in brand-context.md","fact":{"source":"brand-pack/brand-context.md","quote":"No HLR fact here comes from memory; a fact with no source is a gap in the last table."}},{"id":"engine","name":"The engine","what":"The skills that do the work: intake, copy for each channel, the build in Figma, the design system, customer evidence, the squad, the verifier and the options board.","detail":"It carries no HLR fact, so the method stays the same while HLR’s rules change.","stat":"Eleven skills, one method each","technical":"hlr-studio-engine, installed as a Cowork plugin","fact":{"source":"engine:README.md","quote":"Eleven skills, one method each, no brand facts"}},{"id":" "The rehearsal’s brief has eleven parts, from the objective and the audience to what it must never say and how success is measured. Intake reads every one, and anything missing becomes a named gap."},"technical":{"text":"Any form works: a file, pasted text, notes or a PDF.","fact":{"source":"engine:skills/brief-intake/SKILL.md","quote":"Takes a file, pasted text, notes or an extracted PDF"}}},{"id":"intake","n":2,"name":"Intake","skill":"brief-intake","plain":["The forge reads the brief against the pack. It looks up each product, notes which figures the copy may use, adds HLR’s never-say rules and gives every gap an owner.","Then it proposes routes: three strategic angles on the same send by default, five at most, each on a different frame."],"human":"Nobody yet. Intake hands its routes to a person and stops.","reads":["products","ledger","never-say","types","routes"],"makes":[{"file":"made-to-order-pendants.brief.json","label":"Structured brief"},{"file":"made-to-order-pendants.routes.json","label":"Route plan"},{"file":"made-to-order-pendants.intake.md","label":"Intake summary"}],"checks":[{"name":"Brief lint","key":"brief"}],"evidence":"intake","first_run":{"text":"The first run failed on a schema rule: a 1200-wide email master wasn’t an allowed width. The gap went on the engine’s list (G7), the brief was corrected, and the re-run passed. Both runs are kept.","fact":{"source":"outputs/step-4-figma/engine-gaps-chat6.md","quote":"so an email master at 1200 fails the schema."}},"predict":{"q":"The brief would like to name the pendants’ metal. The product records have no descriptions yet. What does intake do?","a":"It allows no figure and names the gap, with HLR as its owner. No metal, karat, size or meaning line goes into the copy until HLR’s Shopify export arrives.","fact":{"source":"outputs/step-4-figma/demo-email/made-to-order-pendants.intake.md","quote":"Product descriptions are empty until HLR\'s Shopify export lands (Brand Review v2 Q5), so no material, karat, size or meaning line is allowed."}},"technical":{"text":"brief_lint.js checks the brief and routes against the schema, the allowed figures, the never-say union and the ledger. It matches words, not meaning.","fact":{"source":"engine:skills/brief-intake/SKILL.md","quote":"the lint matches wording and never judges meaning"}}},{"id":"pick","n":3,"name":"Pick a route","skill":null,"plain":["Three routes came back: product (the making), benefit (an intention) and occasion (the giving season).","The forge said which one it would pick and why, then stopped."],"human":"A person picks the route. The forge never makes this call.","reads":["routes"],"makes":[],"checks":[],"evidence":"routes","route_note":"Route 1’s angle still says “one at a time”, a claim about how the pieces are made. The brief later dropped the phrase, and the copy never used it. See Review for why no check caught it.","fact":{"source":"outputs/step-4-figma/demo-email/made-to-order-pendants.intake.md","quote":"A recommendation, not a decision: the angle is the one call the model never makes for you."},"predict":{"q":"Why didn’t the forge recommend the benefit route?","a":"HLR’s benefit language leans on health and intention, so every benefit line goes through the claims ledger and waits for HLR’s ruling on positioning and claims (C2). The product route rests on the one fact the pack carries for all four pendants: made to order.","fact":{"source":"brand-pack/route-axes.json","quote":"every benefit line goes through the claims ledger and waits for C2"}},"technical":{"text":"The pick is recorded on the route: selected_by human. Here the plan stays provisional, picked by recommendation under Eddie’s delegation.","fact":{"source":"engine:skills/brief-intake/SKILL.md","quote":"A picked route is a frame, not a scene"}}},{"id":"copy","n":4,"name":"Copy","skill":"email-copy","plain":["The forge writes the picked route as one whole piece. Then it maps each line into the slots of the modules it will use, trims anything over a slot’s measured length, and checks every line against the claims ledger and HLR’s voice.","Its findings come back sorted by who can act on them."],"human":"A person approves the lines, or picks another angle inside the route.","reads":["voice","exemplars","lexicon","slots","ledger","never-say"],"makes":[{"file":"made-to-order-pendants.slates.json","label":"Copy slate"},{"file":"made-to-order-pendants.onepager.html","label":"One-pager"},{"file":"made-to-order-pendants.findings.md","label":"Findings by owner"}],"checks":[{"name":"Claims and copy lint","key":"copy"},{"name":"Fit check","key":"fit"},{"name":"Voice lint, advisory","key":"voice"}],"evidence":"copy","voice_note":{"text":"The voice lint warned because HLR has no fitted voice model yet. It ran on the engine’s default weights, said so, and stays advisory.","fact":{"source":"outputs/step-4-figma/demo-email/made-to-order-pendants.voice-lint.json","quote":"This lint never fails a slate"}},"predict":{"q":"A draft line says a crystal treats anxiety. What happens?","a":"It’s blocked twice: by a never-say pattern, and by ledger row HLR-H02, which holds any line that ties a piece or a stone to anxiety until HLR’s claims signer rules.","verdict":"treats-anxiety","fact":{"source":"brand-pack/legal-ledger.json","quote":"No line ties a piece or a stone to anxiety, stress, mood, grief, trauma, sleep or any mental-health state."}},"technical":{"text":"Compose whole, map to slots, cut (fit_check.js), lint (copy_lint.js, voice_lint.js). lib/claims.js is the one ledger matcher every lint shares.","fact":{"source":"engine:README.md","quote":"copy is composed whole, then mapped to slots, cut to budget by a separate pass"}}},{"id":"squad","n":null,"name":"Squad","branch":true,"skill":"squad-run · verify · options-board","plain":["For a bigger send, the forge can develop every route at once: one worker per route, an independent judge that compares the routes in pairs, and a board that lays them side by side.","The rehearsal didn’t use it. It costs far more than a single draft."],"human":"A person picks from the board. The judge ranks; it doesn’t choose.","reads":["routes","taste"],"makes":[{"file":"route packets","label":"One packet per route"},{"file":"options board","label":"The board"}],"checks":[],"evidence":"squad","cost":{"text":"About 250K output tokens per route worker, plus the judge.","fact":{"source":"engine:skills/squad-run/SKILL.md","quote":"about 250K output tokens per route worker plus the judge"}},"predict":{"q":"Does the judge pick the winning route?","a":"No. It ranks routes from pairwise comparisons and reports how often it agrees with HLR’s own blind marks. With no marks on file yet, every rank says so.","fact":{"source":"engine:skills/verify/SKILL.md","quote":"Reports how often that judge agrees with the brand owner\'s own blind marks, or says that it has never been checked"}},"technical":{"text":"workflows/squad-run.js; the judge never sees the workers’ transcripts.","fact":{"source":"engine:skills/verify/SKILL.md","quote":"never the human pick"}}},{"id":"build","n":5,"name":"Build","skill":"asset-production","plain":["The forge assembles the email in HLR Library from modules: a header, a hero, a text block, a product grid, an image band, a closing button and the footer. Each line drops into its slot, and cleared photos go into the image wells.","Nothing is drawn freehand. Every piece is an instance of a library module bound to HLR’s tokens."],"human":"Eddie confirms the build at Review 2.","reads":["figma","modules","slots","tokens","strictness","art"],"makes":[{"file":"HLR Library · 04 Staging","label":"The email, in Figma"},{"file":"build.md","label":"Build notes"},{"file":"demo-email-preview.png","label":"Preview"}],"checks":[{"name":"Structure lint","verdict":"PASS"},{"name":"Flex: every slot holds 2x or more","verdict":"PASS"},{"name":"Canvas and face checks","verdict":"PASS"}],"checks_fact":{"source":"outputs/step-4-figma/demo-email/build.md","quote":"every module and element passes structure lint, flex at 2x or better, canvas and face checks"},"evidence":"build","fact":{"source":"outputs/step-4-figma/demo-email/build.md","quote":"Built from library instances only, no detached layers"},"predict":{"q":"The approved headline is longer than the one in the drawing. What gives?","a":"Nothing, as long as it fits its slot. The copy was already cut to each slot’s measured length, and every module grows with its copy: each slot was tested at twice its usual length or more, on HLR’s real faces.","fact":{"source":"brand-pack/slotmap.yaml","quote":"Saol Display, Saol Standard, Trade Gothic LT Std and Homemade Apple"}},"technical":{"text":"Frame 63:354 on 04 Staging; seven slices, each set to export as PNG 1x and @2x, each with alt text.","fact":{"source":"outputs/step-4-figma/demo-email/build.md","quote":"each of the seven carries PNG 1x and @2x export settings in Figma"}}},{"id":"review","n":6,"name":"Review","skill":"REVIEW.md","plain":["A fresh reviewer that never saw the work checks it against the review rules, for up to three rounds.","Scripts catch what they can measure. The reviewer catches what they can’t."],"human":"Eddie rules on anything still open after three rounds.","reads":["tiers","never-ships"],"makes":[],"checks":[],"evidence":"review","lessons":[{"title":"Every script passed. The review still found a blocker.","text":"In the first email batch, every module sat on HLR’s cream ground, while HLR’s emails are white. No lint reads which ground a module uses; a reviewer did.","facts":[{"source":"LEARNINGS.md","quote":"Round 1 of the fresh-context review found a blocker in a batch that had passed every scripted check"},{"source":"DECISIONS.md","quote":"made every email cream (round 1, R1-01, the blocker)"}]},{"title":"Checks match words, not meaning.","text":"Route 1’s angle said “one at a time”, which is a claim about how the pieces are made. No rule lists those words, so no lint fired. The brief’s author caught it and dropped it from the copy.","verdict":"one-at-a-time","facts":[{"source":"engine:lib/claims.js","quote":"MATCHING IS DETERMINISTIC AND ONLY EVER LEXICAL."},{"source":"DECISIONS.md","quote":"the phrase reads as a claim about the making"}]}],"predict":{"q":"Every automated check passed. Is the email done?","a":"Not yet. A fresh reviewer still reads it, because some defects only a reader sees. Then Eddie gives his go before anything reaches HLR.","fact":{"source":"REVIEW.md","quote":"anything that leaves this brand home for HLR"}},"technical":{"text":"Findings are graded blocker, should-fix or note; up to three rounds; a tier 2 go is a dated DECISIONS line.","fact":{"source":"REVIEW.md","quote":"A release is an engine version, a lane\'s or chat\'s close, or a deliverable handed to Eddie or HLR."}}},{"id":"ship","n":7,"name":"Ship","skill":null,"plain":["The email leaves Figma as image slices, each with alt text, and goes into HLR’s email platform.","The platform’s live footer adds the unsubscribe link and the postal address, because a slice is a picture and can’t carry live links."],"human":"A person sends it.","reads":["required"],"makes":[{"file":"seven slices","label":"PNG 1x and @2x"}],"checks":[],"evidence":"ship","status_note":{"text":"Nothing ships yet. The ledger is a test seed and HLR hasn’t named a claims signer, so no line is cleared for production.","fact":{"source":"outputs/step-4-figma/demo-email/made-to-order-pendants.findings.md","quote":"no line here is cleared for production until HLR names its claims signer (C2)"}},"predict":{"q":"Why is the footer’s legal line switched off in the sliced email?","a":"A slice bakes merge tokens into pixels, so the unsubscribe link and the address would stop working. The platform’s live footer carries them instead.","fact":{"source":"DECISIONS.md","quote":"a slice bakes the tokens into pixels, so the send would have no working unsubscribe link or address"}},"technical":{"text":"M09 Footer with the legal line off; the platform’s image map or separate card slices carry the four product links, an ESP question for Review 2.","fact":{"source":"outputs/step-4-figma/demo-email/build.md","quote":"a slice cannot carry live merge tokens, so the ESP\'s live footer adds the unsubscribe link and the address."}}},{"id":"learn","n":8,"name":"Learn","skill":null,"plain":["Once real sends go out, HLR’s reviewers mark lines keep or cut without knowing which route wrote them. The marks become HLR’s favorites, a voice model fitted to HLR, and the judge’s rubric.","Until then, every run says plainly that it has no measured preference on file."],"human":"Eddie marks the first sheet. HLR’s reviewers mark later.","reads":["taste","exemplars"],"makes":[],"checks":[],"evidence":"learn","fact":{"source":"outputs/step-4-figma/demo-email/made-to-order-pendants.findings.md","quote":"no measured preference is on file"},"predict":{"q":"How does the forge learn what HLR likes?","a":"From blind keep-or-cut marks on real output. HLR’s favorites then outrank the historical examples, and the judge’s agreement with HLR’s marks is measured and reported.","fact":{"source":"engine:README.md","quote":"the brand owner\'s favorites outrank the historical exemplars"}},"technical":{"text":"Roles favorites, voice_calibration, voice_model, judge_rubric and judge_calibration are null until Step 5’s marks sheet.","fact":{"source":"brand-pack/brand-context.md","quote":"derived from the blind marks, ratified by Eddie before a judge reads it"}}}],"rulebook":{"headline":["Every rule has an ","owner"],"intro":"Each card is one part of the pack: what it controls, where it lives, who can change it, why it exists and what runs again after a change. Read the reason before changing a rule.","waiting_label":"Waiting on HLR","waiting_intro":"What HLR owes the forge, and what each item unblocks. These come straight from the pack’s gap register."},"layers":[{"id":"facts","name":"Facts","blurb":"What HLR sells and what’s true about it." rns","example":{"text":"“Treats anxiety” is blocked, whatever the piece.","verdict":"treats-anxiety"},"owner":"Eddie.","tier":"Tier 2.","why":{"text":"Every brief inherits this list, so no brief can forget it.","fact":{"source":"engine:skills/brief-intake/SKILL.md","quote":"unions the brief\'s never-say list with the pack\'s prohibited patterns"}},"enforced":["Every lint, on every channel"],"rerun":"The next run of any skill.","gaps":[]},{"id":"required","layer":"claims","roles":[],"name":"Required footer text","state":"In force","file":"brand-pack/legal-ledger.json · HLR-REQ-01","controls":"The site’s footer disclaimer, carried word for word in every email footer and on every product page.","stat":"One row, carried verbatim","example":{"text":"The forge places it and never rewrites it.","fact":{"source":"brand-pack/legal-ledger.json","quote":"Carried verbatim, never paraphrased, in the footer of every email and on every product page"}},"owner":"HLR.","tier":"Tier 3.","why":{"text":"The wording is HLR’s. Whether paid and organic social carry it is HLR’s call too.","fact":{"source":"brand-pack/legal-ledger.json","quote":"Whether paid and organic social carry it, and in what form, is HLR\'s to rule (C2)."}},"enforced":["M09 Footer carries it verbatim"],"rerun":"A wording change updates the row and the footer module.","gaps":[]},{"id":"evidence","layer":"claims","roles":[],"name":"Reviews and customer words","state":"Empty","file":"grounding_inputs · empty","controls":"Reviews, testimonials and press, used only word for word and only with a source a reviewer can open.","stat":"Empty until HLR sends a reviews export","example":{"text":"A review is never written, never paraphrased into a quote.","fact":{"source":"brand-pack/legal-ledger.json","quote":"Never written, never paraphrased into a quote"}},"owner":"HLR supplies the reviews. Eddie keeps the evidence.","tier":"Tier 3 for the source; a person confirms each use.","why":{"text":"Customer words often carry claims HLR :{"headline":["Which tool for which ","job"],"intro":"Claude Design and the forge both make on-brand work with Claude. They solve different problems, and they work well together.","thesis":"Claude Design knows how HLR looks. The forge also knows what HLR may say, about which product, in which module, at what length, and who signs it off.","checked":"2026-10-23","cd_facts":[{"text":"Claude Design now lives in Claude: new designs, design systems and slide decks are artifacts. Its standalone site closes on December 14, 2026.","source":"https://support.claude.com/en/articles/17440474-move-from-standalone-claude-design-to-claude","checked":"2026-10-23","quote":"Claude Design now lives in Claude."},{"text":"It makes first drafts from a description, styled to your brand: one-pagers, mockups, presentations and clickable prototypes.","source":"https://claude.com/product/design","checked":"2026-10-23"},{"text":"It builds a design system from a GitHub repo, design files or uploads, builds with your components, and checks its output against the system before you see it. Admins can lock a team to one approved system.","source":"https://claude.com/product/design","checked":"2026-10-23","quote":"makes corrections before you see it"},{"text":"You edit by commenting on any element, editing text on the canvas, using sliders for spacing and color, and dragging, resizing and aligning.","source":"https://claude.com/product/design","checked":"2026-10-23"},{"text":"It downloads as PPTX, PDF or HTML, connects to Canva and other tools, and hands off to Claude Code. Figma isn’t among the integrations its product page lists.","source":"https://claude.com/product/design","checked":"2026-10-23"},{"text":"It’s included in every Claude plan and counts toward plan usage. It launched as a research preview from Anthropic Labs on April 17, 2026.","source":"https://www.anthropic.com/news/claude-design-anthropic-labs","checked":"2026-10-23"}],"rows":[{"dim":"The job","cd":"Explore and make a first draft fast: one-pagers, mockups, decks, prototypes.","forge":"HLR’s recurring email and social, on brand and on claim, in HLR’s Figma library."},{"dim":"What it knows about HLR","cd":"A design system: colors, type, components and guidelines, checked against its output.","forge":"The pack: products, claims, voice, kinds of send, tokens, measured slot lengths, owners, and where every rule came from."},{"dim":"When a fact is missing","cd":"Works from your prompt, your files and the design system.","forge":"Stops, names the gap and says who can fill it."},{"dim":"Claims","cd":"No claims ledger among its listed features. The review is yours.","forge":"{ledger_rows} ledger rows and {patterns} never-say patterns, checked on every run."},{"dim":"Copy","cd":"Writes copy along with the design.","forge":"Routes on different strategic frames, written whole, cut to measured lengths, checked against the ledger and the voice."},{"dim":"Layout","cd":"Free-form. New layouts welcome, within the design system.","forge":"{modules} email modules and {elements} elements as library instances, each slot proven to hold twice its copy, on certified contrast pairs."},{"dim":"Where the work lands","cd":"An artifact in Claude. PPTX, PDF, HTML, Canva, Claude Code.","forge":"A frame in HLR Library in Figma, on HLR’s own faces, with slices set to export for the email platform."},{"dim":"The person’s part","cd":"Steer by chat, comments, sliders and direct edits.","forge":"Pick the route, ratify proposals, mark keep or cut, sign off claims."},{"dim":"Changing the rules","cd":"Refine the design system.","forge":"Change one pack file with its owner and tier. Every check runs again on the next brief."},{"dim":"Setup and upkeep","cd":"Bring in a repo or files; Claude builds the system.","forge":"Four weeks for Phase 1, and the pack needs an owner."},{"dim":"Speed and cost","cd":"A first draft from a description, on plan usage.","forge":"Slower and heavier. A full squad run is about 250K output tokens per route, plus the judge."}],"cd_better":[{"point":"A first draft from a sentence","detail":"Describe it and see it. The forge needs a brief and a run."},{"point":"Any format","detail":"One-pagers, decks, prototypes and pieces the forge has no module or type for."},{"point":"Shaping by pointing","detail":"Comment on an element, drag a slider, edit text on the canvas."},{"point":"Light upkeep","detail":"A design system built from your files, and no pack of facts to keep current."},{"point":"Hand-offs the forge doesn’t make","detail":"PPTX, PDF, HTML, Canva and Claude Code."},{"point":"Open to everyone","detail":"It’s in every Claude plan, Free included."}],"forge_better":[{"point":"Claims in sensitive territory","detail":"HLR’s live site carries benefit lines such as “CALM YOUR ANXIETY”. A design system records how a brand looks, not which of its own lines need a sign-off. The forge holds any line that ties a piece or a stone to anxiety until HLR’s claims signer rules.","facts":[{"source":"brand-pack/route-axes.json","quote":"CALM YOUR ANXIETY"},{"source":"brand-pack/legal-ledger.json","quote":"No line ties a piece or a stone to anxiety, stress, mood, grief, trauma, sleep or any mental-health state."}]},{"point":"Facts that stay true","detail":"All {empty_desc} product descriptions are empty today, so the rehearsal email states no metal, karat, stone meaning, size or price. The forge treats a missing fact as missing.","facts":[{"source":"outputs/step-4-figma/demo-email/brief-made-to-order-pendants.md","quote":"The product descriptions are empty, so the copy states no material, karat, stone meaning, size or price."}]},{"point":"Copy that fits before it’s built","detail":"Every slot has a length measured on HLR’s real faces. Copy is cut to it before the build, and every module is proven to hold at least twice its usual copy.","facts":[{"source":"brand-pack/slotmap.yaml","quote":"Saol Display, Saol Standard, Trade Gothic LT Std and Homemade Apple"},{"source":"outputs/step-4-figma/demo-email/build.md","quote":"every module and element passes structure lint, flex at 2x or better, canvas and face checks"}]},{"point":"One brand across a year of sends","detail":"Every email is assembled from the same library modules, as instances bound to HLR’s tokens. Nothing is drawn freehand, so a fix to a module reaches every send.","facts":[{"source":"outputs/step-4-figma/demo-email/build.md","quote":"Built from library instances only, no detached layers"}]},{"point":"Work lands in Figma, where HLR designs","detail":"The forge builds in HLR Library, with slices set to export for the email platform and alt text on every slice. Figma isn’t among Claude Design’s listed integrations.","facts":[{"source":"outputs/step-4-figma/demo-email/build.md","quote":"Alt text on every slice"}]},{"point":"Strategy before style","detail":"It proposes routes on different strategic frames, says which it would pick and why, and leaves the pick to a person.","facts":[{"source":"outputs/step-4-figma/demo-email/made-to-order-pendants.intake.md","quote":"A recommendation, not a decision: the angle is the one call the model never makes for you."}]},{"point":"A trail for every line","detail":"Each run leaves a brief, a route plan, lint reports and findings sorted by owner. Every rule cites its source, and every decision is a dated line with its reason.","facts":[{"source":"outputs/step-4-figma/demo-email/made-to-order-pendants.findings.md","quote":"9 findings, routed by who can act on them. 6 of them are not the drafter\'s."}]},{"point":"Taste that learns HLR","detail":"Blind keep-or-cut marks become HLR’s favorites, a voice model and the judge’s rubric, and the judge reports how often it agrees with HLR.","facts":[{"source":"engine:skills/verify/SKILL.md","quote":"Reports how often that judge agrees with the brand owner\'s own blind marks, or says that it has never been checked"}]},{"point":"Loud absence","detail":"When something is missing, such as a claims signer, a license or a vector, the forge says so, names the owner and keeps a placeholder. It never fills the gap with something plausible.","facts":[{"source":"REVIEW.md","quote":"with a gap line naming what is missing and its owner"}]}],"together":["Explore in Claude Design. When a concept keeps coming back, it graduates into the forge as a kind of send or a module.","Use Claude Design for the one-off pieces the forge doesn’t make: a pitch deck, a one-pager, a prototype. Check any product fact or claim against the pack before it goes out.","Worth testing, not yet a claim: whether HLR’s tokens can seed a Claude Design system, so explorations start on brand."],"picker":[{"job":"The weekly product email","pick":"forge","why":"A recurring send with product facts and claims, built where HLR already designs."},{"job":"A one-page sheet for a wholesale meeting","pick":"cd","why":"A one-off format with no module, exported as a PDF. Check its product facts against the pack first."},{"job":"Three moodboard directions for spring","pick":"cd","why":"Exploration, where speed and range matter more than a governed build."},{"job":"A launch email with intention language","pick":"forge","why":"Intention lines go through the ledger’s meaning rows and the voice contract’s rule: tradition or intention, never an outcome."},{"job":"Captions for Monday’s carousel","pick":"forge","why":"The social copy skill checks claims and Instagram’s limits now. The carousel frames come with the social batch."},{"job":"A clickable prototype of a new site page","pick":"cd","why":"A prototype is Claude Design’s home ground. The forge’s web modules come after Review 2."}]},"check":{"headline":["Trace it ","yourself"],"intro":"Five questions. Each one is a real situation the forge handles today."},"quiz":[{"q":"A draft line copies the Element Pendant’s metal and karat from the website. Can it run today?","options":["Yes, it’s on the website","No: the product description is empty, so no karat line is allowed yet","Only in the footer"],"answer":1,"why":"Metal and karat are written exactly as the product file carries them, and the descriptions stay empty until HLR’s Shopify export lands.","fact":{"source":"brand-pack/legal-ledger.json","quote":"Write the metal and karat exactly as the product database carries them for the piece named"}},{"q":"HLR’s claims signer clears origin claims. Which file changes?","options":["The voice contract","The claims ledger, row HLR-O01","The slot lengths"],"answer":1,"why":"One row’s severity changes, and every lint reads the ledger on its next run.","fact":{"source":"brand-pack/legal-ledger.json","quote":"HLR\'s confirmation of where and by whom each piece is made."}},{"q":"The team wants a filled button instead of the outline box. Who decides?","options":["Anyone on HLR’s team","Eddie: the button shape was ruled at Gate 1, for HLR to confirm","The forge picks the better one"],"answer":1,"why":"The button is a locked element. Gate 1 ruled the outline caps box, and filled boxes retired.","fact":{"source":"brand-pack/strictness-map.md","quote":"Gate 1 C6 (outline caps box; filled boxes retire)"}},{"q":"Every automated check passed. What’s still needed before HLR sees a new deliverable?","options":["Nothing","A fresh review, then Eddie’s go","The same checks again"],"answer":1,"why":"Some defects only a reader sees. Anything that leaves the brand home for HLR also needs Eddie’s explicit go.","fact":{"source":"REVIEW.md","quote":"anything that leaves this brand home for HLR"}},{"q":"You need a one-off pitch deck for a buyer meeting. Which tool?","options":["The forge","Claude Design","Either, it doesn’t matter"],"answer":1,"why":"A one-off in a format the forge has no module for is Claude Design’s job. Check any product fact or claim against the pack before it goes out."}],"close":{"headline":"You can now","items":["Trace one email from the ask to the send.","Find the file and the owner behind any rule.","Say what changes, who approves it and what runs again.","Choose between the forge and Claude Design."],"next":"Next: open the rulebook’s Waiting on HLR view. It lists what HLR owes the forge and what each item unblocks."},"glossary":[{"term":"Pack","plain":"The folder of files that holds HLR’s rules and facts. The forge reads it fresh on every run."},{"term":"Engine","plain":"The forge’s skills. They carry no HLR fact of their own."},{"term":"Library","plain":"HLR Library in Figma: the variables, styles, elements, modules and templates."},{"term":"Element","plain":"The smallest reusable piece: a button, a text link, a rule, an image frame, a product card."},{"term":"Module","plain":"A section of an email, such as a hero, a product grid or a footer, made from elements."},{"term":"Template","plain":"A whole email made only from module instances, ready for copy and photos."},{"term":"Slot","plain":"One place for a line of copy inside a module, such as the hero headline."},{"term":"Slot length","plain":"How long a slot’s copy may be, measured on HLR’s real faces."},{"term":"Route","plain":"One strategic angle on a send, on a named frame such as product, benefit or occasion."},{"term":"Angle gate","plain":"The point where a person picks the route or the angle. The forge recommends; it never picks."},{"term":"Ledger","plain":"The claims ledger: what HLR may say and what needs a sign-off."},{"term":"Lint","plain":"An automatic check that reads files and reports PASS, WARN or FAIL."},{"term":"Gate","plain":"A stop in the plan where Eddie or HLR rules before work goes on."},{"term":"Ground","plain":"The background a piece sits on: light, warm, deep or night. Text colors follow it."},{"term":"Canvas","plain":"The size family a piece is built for: web, social or email."},{"term":"Token","plain":"A named design value, such as a color or a type size, shared by Figma and the web."},{"term":"Provenance tag","plain":"Where a rule came from: documented, observed or derived."},{"term":"Fresh review","plain":"A review by an agent that never saw the work being made, so the work doesn’t grade itself."},{"term":"Merge token","plain":"A placeholder such as {{ discount_code }}, filled in by a person or the email platform."},{"term":"Loud absence","plain":"The habit of naming what’s missing, with an owner, instead of filling it in."}]}');var A={};A=JSON.parse('{"_role":"explainer data","_note":"Generated by build_data.py from the pack and the record. Never edit by hand: rebuild.","file_map":{"brand":"High Light Rituals","brand_slug":"hlr","folder":"/Users/eddie/Documents/claude-cowork/highlight-brandbook/brand-pack","voice_contract":"voice-contract.md","exemplars":"exemplars.json","favorites":null,"voice_calibration":null,"voice_model":null,"concrete_lexicon":"concrete-lexicon.json","judge_rubric":null,"judge_calibration":null,"product_db":"products.json","corpus":null,"prohibited_patterns":["\\\\u2014","\\\\bhightlight","\\\\btoumaline\\\\b|\\\\bpendent\\\\b|\\\\bguranteed\\\\b|\\\\breail\\\\b|\\\\bstres\\\\b|\\\\bjouney\\\\b","\\\\bcur(e|es|ed|ing)\\\\b","\\\\b(treat|treats|treating|prevent|prevents|preventing|reverse|reverses)\\\\s+(your\\\\s+)?(anxiety|depression|disease|diseases|illness|illnesses|cancer|infertility|insomnia|pain|symptoms|conditions?|disorders?)\\\\b","\\\\b(instead of|replaces?|replacement for|no need for|alternative to)\\\\s+(your\\\\s+|a\\\\s+)?(medication|medicine|doctor|therapist|therapy|treatment|prescription)s?\\\\b"],"legal_ledger":"legal-ledger.json","type_registry_core":"type-registry-core.json","type_registry_overlay":null,"module_library":"module-library.json","slotmap":"slotmap.yaml","seam_map":"seam-map.json","strictness_map":"strictness-map.md","options_register":null,"onepager_palette":null,"importer":null,"slotmap_paid":null,"slotmap_web":null,"slotmap_social":"slotmap-social.yaml","section_library":null,"grounding_inputs":null,"tokens":"tokens.json","figma_config":"figma.yaml","logo_assets":"logo-assets.md","art_direction":"art-direction.md","asset_types":"asset-type ":"#fbf7ef","night":"#353535","deep":"#17280a","warm":"#beada3"},"background.email-page":{"light":"#ffffff","night":"#353535","deep":"#17280a","warm":"#beada3"},"background.subtle":{"light":"#ece8e3","night":"#353535","deep":"#17280a","warm":"#beada3"},"background.placeholder":{"light":"#dcd8d4","night":"#dcd8d4","deep":"#dcd8d4","warm":"#dcd8d4"},"background.scrim":{"light":"#00000080","night":"#00000080","deep":"#00000080","warm":"#00000080"},"text.primary":{"light":"#353535","night":"#fbf7ef","deep":"#fbf7ef","warm":"#353535"},"text.muted":{"light":"#63615f","night":"#c5c2be","deep":"#c5c2be","warm":"#353535"},"text.on-photo":{"light":"#ffffff","night":"#ffffff","deep":"#ffffff","warm":"#ffffff"},"text.on-placeholder":{"light":"#353535","night":"#353535","deep":"#353535","warm":"#353535"},"interactive.cta":{"light":"#353535","night":"#fbf7ef","deep":"#fbf7ef","warm":"#353535"},"interactive.link":{"light":"#353535","night":"#fbf7ef","deep":"#fbf7ef","warm":"#353535"}},"ledger":{"status":"test-seed","version":"hlr-ledger-0.2.0 (test-seed, 2026-10-21; Gate 2 rulings applied)","signer":null,"counts":{"needs_legal":8,"info":7,"conditional":4},"entries":[{"id":"HLR-H01","topic":"health","severity":"needs_legal","title":"Disease, cure, treatment and healing","requires":"A ruling from HLR\'s claims signer (not yet named; C2, Review 1). Until then no line states or implies that a piece, a crystal or a session heals, treats, cures or remedies anything."},{"id":"HLR-H02","topic":"health","severity":"needs_legal","title":"Mental and emotional health","requires":"A ruling from HLR\'s claims signer (not yet named; C2, Review 1). No line ties a piece or a stone to anxiety, stress, mood, grief, trauma, sleep or any mental-health state."},{"id":"HLR-H03","topic":"health","severity":"needs_legal","title":"Body, sleep, allergy and skin","requires":"A ruling from HLR\'s claims signer (not yet named; C2, Review 1). No physical-health, sleep, allergy or skin claim."},{"id":"HLR-H04","topic":"health","severity":"needs_legal","title":"Energy healing services, readings and practitioner credentials","requires":"A ruling from HLR\'s claims signer (not yet named; C2, Review 1) on how sessions and readings sold as products are described (products.json gap: services sold as products, C2), and HLR\'s confirmation of each credential before it is named."},{"id":"HLR-F01","topic":"fertility","severity":"needs_legal","title":"Fertility, pregnancy and the body\'s cycles","requires":"A ruling from HLR\'s claims signer (not yet named; C2, Review 1). No line links a piece to fertility, conception, pregnancy or the cycle, including as symbolism."},{"id":"HLR-S01","topic":"sourcing","severity":"needs_legal","title":"Ethical, responsible, recycled and sustainable sourcing","requires":"A ruling from HLR\'s claims signer (not yet named; C2, Review 1) and the supplier evidence behind each claim (chain of custody, recycled-content records)."},{"id":"HLR-S02","topic":"sourcing","severity":"needs_legal","title":"Natural, genuine and untreated stones; grades and quality","requires":"A ruling from HLR\'s claims signer (not yet named; C2, Review 1) and HLR\'s supplier records for treatment and grade."},{"id":"HLR-O01","topic":"origin","severity":"needs_legal","title":"Origin, place of making, handmade and one of a kind","requires":"A ruling from HLR\'s claims signer (not yet named; C2, Review 1) and HLR\'s confirmation of where and by whom each piece is made."},{"id":"HLR-K01","topic":"materials","severity":"info","title":"Metal and karat","requires":"Write the metal and karat exactly as the product database carries them for the piece named (variants: HLR\'s Shopify export, Review 1). No sign-off: every lint lists this row for the verifier under checked.paraphrase_review with its hit count, and nothing blocks on it (Eddie, Gate 2, lane C call 4). A karat number is also a figure, and the figure rule still needs it in the facts layer or the brief."},{"id":"HLR-K02","topic":"materials","severity":"conditional","title":"Durability, water, tarnish and guarantees","requires":"The care facts as the product database carries them (none yet: descriptions are empty), and HLR\'s written policy for any guarantee or warranty."},{"id":"HLR-M01","topic":"metaphysical","severity":"info","title":"Protection and warding stated as what the piece does","requires":"Framed as tradition or intention (\'worn as a reminder to\', \'long held as a stone of\'), never as a promised effect; a piece that carries one also carries the footer disclaimer (HLR-REQ-01). No sign-off: every lint lists this row for the verifier under checked.paraphrase_review with its hit count, and nothing blocks on it (Eddie, Gate 2, lane C call 5). HLR\'s C2 ruling may still change the posture."},{"id":"HLR-M02","topic":"metaphysical","severity":"info","title":"Abundance, luck, love and manifestation stated as an outcome","requires":"Framed as tradition or intention (\'worn as a reminder to\', \'long held as a stone of\'), never as a promised effect; a piece that carries one also carries the footer disclaimer (HLR-REQ-01). No sign-off: every lint lists this row for the verifier under checked.paraphrase_review with its hit count, and nothing blocks on it (Eddie, Gate 2, lane C call 5). HLR\'s C2 ruling may still change the posture."},{"id":"HLR-M03","topic":"metaphysical","severity":"info","title":"Energy work done to the piece: activated, charged, infused, blessed","requires":"Framed as tradition or intention (\'worn as a reminder to\', \'long held as a stone of\'), never as a promised effect; a piece that carries one also carries the footer disclaimer (HLR-REQ-01). No sign-off: every lint lists this row for the verifier under checked.paraphrase_review with its hit count, and nothing blocks on it (Eddie, Gate 2, lane C call 5). HLR\'s C2 ruling may still change the posture. Whether the process happens for the piece named is HLR\'s to confirm (C2)."},{"id":"HLR-M04","topic":"metaphysical","severity":"info","title":"Chakra, vibration, frequency and aura","requires":"Framed as tradition or intention (\'worn as a reminder to\', \'long held as a stone of\'), never as a promised effect; a piece that carries one also carries the footer disclaimer (HLR-REQ-01). No sign-off: every lint lists this row for the verifier under checked.paraphrase_review with its hit count, and nothing blocks on it (Eddie, Gate 2, lane C call 5). HLR\'s C2 ruling may still change the posture."},{"id":"HLR-M05","topic":"metaphysical","severity":"info","title":"Stone meaning stated as an outcome","requires":"Framed as tradition or intention (\'worn as a reminder to\', \'long held as a stone of\'), never as a promised effect; a piece that carries one also carries the footer disclaimer (HLR-REQ-01). No sign-off: every lint lists this row for the verifier under checked.paraphrase_review with its hit count, and nothing blocks on it (Eddie, Gate 2, lane C call 5). HLR\'s C2 ruling may still change the posture. A stone\'s meaning is said as what the stone has long stood for, never as what it will do for the reader."},{"id":"HLR-T01","topic":"endorsements","severity":"conditional","title":"Reviews, press, ratings and popularity","requires":"The verbatim source: a review in Judge.me or a press piece with its URL, held in customer evidence. Never written, never paraphrased into a quote (Brand Review v2 Q7)."},{"id":"HLR-T02","topic":"identity","severity":"conditional","title":"Ownership and identity claims","requires":"HLR\'s own wording, confirmed by HLR as current, for any ownership or identity line; never paraphrased."},{"id":"HLR-P01","topic":"offers","severity":"conditional","title":"Offer terms: free shipping, gifts with purchase, codes, sale windows","requires":"Every figure, threshold, code and date as a merge token until HLR rules C10 ({{ free_shipping_threshold }}, {{ discount_code }}); a person confirms the terms against the brief."},{"id":"HLR-REQ-01","topic":"required_language","severity":"info","title":"The site footer disclaimer, verbatim","requires":"Carried verbatim, never paraphrased, in the footer of every email and on every product page, and wherever a line carries a health-adjacent or metaphysical benefit (the M entries). Brief-fed into the disclaimer slot. Whether paid and organic social carry it, and in what form, is HLR\'s to rule (C2)."}]},"voice":{"qualities":[{"name":"Eloquent","definition":"the line makes one point, exactly. A spiritual or abstract idea is explained in plain words, or anchored to something concrete in the same sentence or the next. A long line earns its length by explaining, never by stacking adjectives.","check":"does it say one thing exactly, with every abstract idea anchored?"},{"name":"Refined","definition":"confident and unhurried. No hype words, no stacked exclamation marks, no pun that strains. A wink or a cultural reference is welcome when it is precise and lands without being explained. Spiritual practice is spoken of as ordinary life, never as spectacle.","check":"would it sit at ease beside a prestige brand, with any wink landing on its own?"},{"name":"Sensual","definition":"the line gives the reader something to see, touch, smell or feel (light, texture, a place, a ritual), and it is warm toward the reader. A piece\'s story uses only what the product database carries; where it is from and how it is made are claims until HLR\'s signer rules (ledger HLR-O01, HLR-S01).","check":"can the reader picture or feel something, and is it warm without flirting?"},{"name":"Real","definition":"the line names a specific, recognizable moment or feeling from everyday life, in words a friend would use. Lofty language is balanced by plain language in the same piece. It never promises perfection or a transformed life.","check":"is there a moment the reader knows from their own week, said plainly?"},{"name":"Uplifting","definition":"the reader leaves a little more hopeful or grateful. The piece inspires first, and the product follows as the natural next step, never as the opening demand. Encouragement is specific and sincere, never cheer that could be said of anything.","check":"does it lift the reader before it sells, with nothing that could be said of anything?"}],"rules":6},"exemplars":{"count":159,"by_channel":{"email":72,"social":49,"paid":30,"web":8}},"lexicon":{"product":58,"scene":42,"product_families":15,"product_names":182,"status":"ratified 2026-10-22 by Eddie, Gate 2 package call 14"},"products":{"count":182,"kinds":{"jewelry":159,"service with jewelry":1,"service":4,"jewelry with a service":2,"packaging":1,"crystal":3,"ritual kit":12},"families":15,"empty_descriptions":182},"types":{"count":15,"status":"ratified in part: email and organic social (Gate 2 call 1 b, 2026-10-18); paid and web held for Review 2","items":[{"id":"product_spotlight","label":"Product spotlight","status":"ratified"},{"id":"product_listing","label":"Product listing","status":"ratified"},{"id":"product_launch","label":"Product launch","status":"ratified"},{"id":"editorial_letter","label":"Editorial send: founder letter, product notes, affirmation","status":"ratified"},{"id":"the_edit","label":"The Edit: curated pieces with short notes","status":"ratified"},{"id":"monthly_ritual","label":"Monthly ritual: energy medicine, zodiac season, birthstone month","status":"ratified"},{"id":"testimonials","label":"Testimonials","status":"ratified"},{"id":"moodboard","label":"Moodboard","status":"ratified"},{"id":"offer_launch","label":"Offer launch: sale, holiday event","status":"ratified"},{"id":"offer_urgency","label":"Offer urgency: ends soon","status":"ratified"},{"id":"welcome","label":"Welcome series (lifecycle)","status":"ratified"},{"id":"browse_abandon","label":"Browse abandonment flow","status":"ratified"},{"id":"cart_abandon","label":"Cart abandonment flow","status":"ratified"},{"id":"checkout_abandon","label":"Checkout abandonment flow","status":"ratified"},{"id":"transactional","label":"Trans
